name: .NET Framework 4.8 application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest  # Required for full .NET Framework

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      run: nuget restore ModMiiDownloader.slnx

    - name: Build Solution
      run: msbuild ModMiiDownloader.slnx /p:Configuration=Release /p:Platform="Any CPU"
